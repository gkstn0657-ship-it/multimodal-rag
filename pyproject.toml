[project]
name = "multimodal-rag"
version = "0.1.0"
description = "텍스트·스캔·표·차트가 섞인 문서를 위한 멀티모달 RAG"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pillow>=10.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "huggingface_hub[hf_transfer]>=0.30",
    "pyarrow>=17",
    "torch>=2.6",
    "sentence-transformers>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
