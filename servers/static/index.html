<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>multimodal-rag 테스트</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 20px; }
  #q { width: 100%; padding: 10px; font-size: 15px; box-sizing: border-box; }
  #ask { margin-top: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #ask:disabled { opacity: 0.5; cursor: default; }
  #status { color: #888; font-size: 13px; margin-top: 6px; }
  #answer-box { margin-top: 20px; padding: 14px; background: #f5f5f7; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
  .chunk { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .chunk-head { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 6px; }
  .route { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; color: white; }
  .route-text { background: #4a90d9; }
  .route-ocr { background: #d98e4a; }
  .route-image { background: #7a4ad9; }
  .chunk-text { font-size: 13px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; background: #fafafa; padding: 8px; border-radius: 4px; }
  .chunk img { max-width: 100%; margin-top: 8px; border: 1px solid #eee; border-radius: 4px; }
  .timing { font-size: 12px; color: #999; margin-top: 8px; }
  h2 { font-size: 15px; margin-top: 24px; }
</style>
</head>
<body>
  <h1>multimodal-rag 테스트 화면</h1>
  <p style="color:#666; font-size:13px;">질문을 입력하면 검색된 페이지(텍스트+원본 이미지)와 생성된 답변을 함께 보여줍니다. 근거 페이지를 직접 확인해 답변이 맞는지 판단하세요.</p>
  <input id="q" type="text" placeholder="예: LG화학 2023년 주당 배당금" />
  <button id="ask">질문하기</button>
  <div id="status"></div>

  <div id="result" style="display:none;">
    <h2>답변</h2>
    <div id="answer-box"></div>
    <div class="timing" id="timing"></div>
    <h2>검색된 근거 페이지 (재랭킹 순)</h2>
    <div id="chunks"></div>
  </div>

<script>
const qInput = document.getElementById('q');
const askBtn = document.getElementById('ask');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const answerBox = document.getElementById('answer-box');
const timingEl = document.getElementById('timing');
const chunksEl = document.getElementById('chunks');

function routeClass(route) {
  if (route === 'text') return 'route-text';
  if (route === 'ocr') return 'route-ocr';
  return 'route-image';
}

async function ask() {
  const question = qInput.value.trim();
  if (!question) return;
  askBtn.disabled = true;
  statusEl.textContent = '검색 및 생성 중... (VLM 응답까지 수 초~수십 초 걸릴 수 있습니다)';
  resultEl.style.display = 'none';
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      statusEl.textContent = '오류: ' + (err.detail || res.status);
      askBtn.disabled = false;
      return;
    }
    const data = await res.json();
    answerBox.textContent = data.answer;
    const t = data.timing || {};
    timingEl.textContent = `검색 ${(t.retrieve_sec ?? 0).toFixed(2)}s · 재랭킹 ${(t.rerank_sec ?? 0).toFixed(2)}s · 생성 ${(t.generate_sec ?? 0).toFixed(2)}s · 합계 ${(t.total_sec ?? 0).toFixed(2)}s`;
    chunksEl.innerHTML = '';
    (data.chunks || []).forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'chunk';
      const head = document.createElement('div');
      head.className = 'chunk-head';
      head.innerHTML = `<span>#${i + 1} ${c.page_id} <span class="route ${routeClass(c.route)}">${c.route}</span></span><span>score ${c.score.toFixed(3)}</span>`;
      div.appendChild(head);
      const textDiv = document.createElement('div');
      textDiv.className = 'chunk-text';
      textDiv.textContent = c.text;
      div.appendChild(textDiv);
      if (c.image_url) {
        const img = document.createElement('img');
        img.src = c.image_url;
        img.alt = c.page_id;
        div.appendChild(img);
      }
      chunksEl.appendChild(div);
    });
    resultEl.style.display = 'block';
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = '요청 실패: ' + e;
  } finally {
    askBtn.disabled = false;
  }
}

askBtn.addEventListener('click', ask);
qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
